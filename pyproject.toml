[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sloth-tidy"
version = "0.3.0"
description = "Zero-friction, privacy-first local file organization daemon powered by small open-weight LLMs."
readme = "DEV_POST.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mohamed Taha Enasraoui" }
]
keywords = ["automation", "ollama", "llama-cpp", "file-organizer", "privacy", "daemon", "hacktoberfest"]
dependencies = [
    "pydantic==2.9.2",
    "typer==0.12.5",
    "rich==13.9.2",
    "watchdog==5.0.3",
    "httpx==0.27.2",
    "pypdf==5.0.1",
    "pillow==10.4.0",
    "pytesseract==0.3.13",
    "tomli-w==1.1.0",
]

[project.optional-dependencies]
llama-cpp = [
    "llama-cpp-python==0.3.1",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[project.scripts]
sloth-tidy = "sloth_tidy.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
